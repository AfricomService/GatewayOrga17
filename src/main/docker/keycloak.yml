# Keycloak pour JHipster 7 — remplace jboss/keycloak:15 (obsolète)
# Image: quay.io/keycloak/keycloak:20.0.5 (compatible realm-config JHipster 7)
services:
  keycloak:
    image: quay.io/keycloak/keycloak:20.0.5
    command: start-dev --import-realm
    volumes:
      - ./realm-config:/opt/keycloak/data/import
      - ./keycloak-themes:/opt/keycloak/themes
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HTTP_PORT=9080
      - KC_HTTPS_PORT=9443
      - KC_HEALTH_ENABLED=true
      - KC_DB=dev-file
    # Retirez le préfixe "127.0.0.1:" pour exposer hors de votre PC
    ports:
      - 127.0.0.1:9080:9080
      - 127.0.0.1:9443:9443
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/9080']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
