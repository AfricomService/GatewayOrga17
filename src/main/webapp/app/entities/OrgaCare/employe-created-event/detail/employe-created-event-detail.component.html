<div class="row justify-content-center">
  <div class="col-8">
    <div *ngIf="employeCreatedEvent">
      <h2 data-cy="employeCreatedEventDetailsHeading">
        <span jhiTranslate="orgacaregatewayApp.orgaCareEmployeCreatedEvent.detail.title">Employe Created Event</span>
      </h2>

      <hr />

      <jhi-alert-error></jhi-alert-error>

      <jhi-alert></jhi-alert>

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ employeCreatedEvent.id }}</span>
        </dd>
        <dt><span jhiTranslate="orgacaregatewayApp.orgaCareEmployeCreatedEvent.matricule">Matricule</span></dt>
        <dd>
          <span>{{ employeCreatedEvent.matricule }}</span>
        </dd>
        <dt><span jhiTranslate="orgacaregatewayApp.orgaCareEmployeCreatedEvent.nomPrenom">Nom Prenom</span></dt>
        <dd>
          <span>{{ employeCreatedEvent.nomPrenom }}</span>
        </dd>
        <dt><span jhiTranslate="orgacaregatewayApp.orgaCareEmployeCreatedEvent.email">Email</span></dt>
        <dd>
          <span>{{ employeCreatedEvent.email }}</span>
        </dd>
        <dt><span jhiTranslate="orgacaregatewayApp.orgaCareEmployeCreatedEvent.userId">User Id</span></dt>
        <dd>
          <span>{{ employeCreatedEvent.userId }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>

      <button type="button" [routerLink]="['/employe-created-event', employeCreatedEvent.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
  </div>
</div>
