<div>
  <h2 id="page-heading" data-cy="EmployeCreatedEventHeading">
    <span jhiTranslate="orgacaregatewayApp.orgaCareEmployeCreatedEvent.home.title">Employe Created Events</span>

    <div class="d-flex justify-content-end">
      <button class="btn btn-info mr-2" (click)="loadAll()" [disabled]="isLoading">
        <fa-icon icon="sync" [spin]="isLoading"></fa-icon>
        <span jhiTranslate="orgacaregatewayApp.orgaCareEmployeCreatedEvent.home.refreshListLabel">Refresh List</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-employe-created-event"
        [routerLink]="['/employe-created-event/new']"
      >
        <fa-icon icon="plus"></fa-icon>
        <span jhiTranslate="orgacaregatewayApp.orgaCareEmployeCreatedEvent.home.createLabel"> Create a new Employe Created Event </span>
      </button>
    </div>
  </h2>

  <jhi-alert-error></jhi-alert-error>

  <jhi-alert></jhi-alert>

  <div class="alert alert-warning" id="no-result" *ngIf="employeCreatedEvents?.length === 0">
    <span jhiTranslate="orgacaregatewayApp.orgaCareEmployeCreatedEvent.home.notFound">No employeCreatedEvents found</span>
  </div>

  <div class="table-responsive" id="entities" *ngIf="employeCreatedEvents && employeCreatedEvents.length > 0">
    <table class="table table-striped" aria-describedby="page-heading">
      <thead>
        <tr>
          <th scope="col"><span jhiTranslate="global.field.id">ID</span></th>
          <th scope="col"><span jhiTranslate="orgacaregatewayApp.orgaCareEmployeCreatedEvent.matricule">Matricule</span></th>
          <th scope="col"><span jhiTranslate="orgacaregatewayApp.orgaCareEmployeCreatedEvent.nomPrenom">Nom Prenom</span></th>
          <th scope="col"><span jhiTranslate="orgacaregatewayApp.orgaCareEmployeCreatedEvent.email">Email</span></th>
          <th scope="col"><span jhiTranslate="orgacaregatewayApp.orgaCareEmployeCreatedEvent.userId">User Id</span></th>
          <th scope="col"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let employeCreatedEvent of employeCreatedEvents; trackBy: trackId" data-cy="entityTable">
          <td>
            <a [routerLink]="['/employe-created-event', employeCreatedEvent.id, 'view']">{{ employeCreatedEvent.id }}</a>
          </td>
          <td>{{ employeCreatedEvent.matricule }}</td>
          <td>{{ employeCreatedEvent.nomPrenom }}</td>
          <td>{{ employeCreatedEvent.email }}</td>
          <td>{{ employeCreatedEvent.userId }}</td>
          <td class="text-right">
            <div class="btn-group">
              <button
                type="submit"
                [routerLink]="['/employe-created-event', employeCreatedEvent.id, 'view']"
                class="btn btn-info btn-sm"
                data-cy="entityDetailsButton"
              >
                <fa-icon icon="eye"></fa-icon>
                <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
              </button>

              <button
                type="submit"
                [routerLink]="['/employe-created-event', employeCreatedEvent.id, 'edit']"
                class="btn btn-primary btn-sm"
                data-cy="entityEditButton"
              >
                <fa-icon icon="pencil-alt"></fa-icon>
                <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
              </button>

              <button type="submit" (click)="delete(employeCreatedEvent)" class="btn btn-danger btn-sm" data-cy="entityDeleteButton">
                <fa-icon icon="times"></fa-icon>
                <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
