<div class="site-list-container">
  <!-- Header Banner -->
  <div class="page-header">
    <div class="header-left">
      <div class="header-icon">🏢</div>
      <div class="header-text">
        <h1 jhiTranslate="orgacaregatewayApp.orgaCareSite.home.title">Sites</h1>
        <p>Gérez et consultez la liste des sites</p>
      </div>
    </div>
    <div class="header-actions">
      <button
        class="btn-header-secondary"
        (click)="loadPage()"
        [disabled]="isLoading"
        title="{{ 'orgacaregatewayApp.orgaCareSite.home.refreshListLabel' | translate }}"
      >
        <fa-icon icon="sync" [spin]="isLoading"></fa-icon>
      </button>
      <button
        class="btn-header-primary"
        [routerLink]="['/site/new']"
        title="{{ 'orgacaregatewayApp.orgaCareSite.home.createLabel' | translate }}"
      >
        <fa-icon icon="plus"></fa-icon>
      </button>
    </div>
  </div>

  <jhi-alert-error></jhi-alert-error>
  <jhi-alert></jhi-alert>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!isLoading && sites?.length === 0">
    <div class="empty-icon">🏢</div>
    <h3 jhiTranslate="orgacaregatewayApp.orgaCareSite.home.notFound">Aucun site trouvé</h3>
    <p>Commencez par créer un nouveau site</p>
    <button class="btn-create" [routerLink]="['/site/new']">
      <fa-icon icon="plus"></fa-icon>
      Créer un site
    </button>
  </div>

  <!-- Table Card -->
  <div class="table-card" *ngIf="sites && sites.length > 0">
    <!-- Table -->
    <div class="table-wrapper">
      <table aria-describedby="page-heading">
        <thead>
          <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" (sortChange)="loadPage()">
            <th scope="col" jhiSortBy="nom">
              <div class="th-content">
                <span jhiTranslate="orgacaregatewayApp.orgaCareSite.nom">Nom</span>
                <fa-icon icon="sort" class="sort-icon"></fa-icon>
              </div>
            </th>
            <th scope="col" jhiSortBy="code">
              <div class="th-content">
                <span jhiTranslate="orgacaregatewayApp.orgaCareSite.code">Code</span>
                <fa-icon icon="sort" class="sort-icon"></fa-icon>
              </div>
            </th>
            <th scope="col" jhiSortBy="adresse">
              <div class="th-content">
                <span jhiTranslate="orgacaregatewayApp.orgaCareSite.adresse">Adresse</span>
                <fa-icon icon="sort" class="sort-icon"></fa-icon>
              </div>
            </th>
            <th scope="col" jhiSortBy="societe.id">
              <div class="th-content">
                <span jhiTranslate="orgacaregatewayApp.orgaCareSite.societe">Société</span>
                <fa-icon icon="sort" class="sort-icon"></fa-icon>
              </div>
            </th>
            <th scope="col" class="th-actions">
              <span>Actions</span>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="let site of sites; trackBy: trackId"
            data-cy="entityTable"
            (dblclick)="editSite(site)"
            class="table-row"
            [title]="'Double-cliquer pour modifier'"
          >
            <td>
              <div class="cell-nom">
                <div class="nom-avatar">{{ (site.nom || '?')[0].toUpperCase() }}</div>
                <span class="nom-text">{{ site.nom || '—' }}</span>
              </div>
            </td>
            <td>
              <span class="badge-code" *ngIf="site.code; else noCode">{{ site.code }}</span>
              <ng-template #noCode><span class="cell-empty">—</span></ng-template>
            </td>
            <td>
              <span class="cell-adresse" *ngIf="site.adresse; else noAdresse">{{ site.adresse }}</span>
              <ng-template #noAdresse><span class="cell-empty">—</span></ng-template>
            </td>
            <td>
              <span class="cell-societe" *ngIf="site.societe">{{ site.societe?.raisonSociale || site.societe?.id }}</span>
              <span class="cell-empty" *ngIf="!site.societe">—</span>
            </td>
            <td class="td-actions">
              <button
                type="button"
                class="btn-delete"
                (click)="delete(site); $event.stopPropagation()"
                title="{{ 'entity.action.delete' | translate }}"
              >
                <fa-icon icon="trash"></fa-icon>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="pagination-bar">
      <jhi-item-count [params]="{ page: page, totalItems: totalItems, itemsPerPage: itemsPerPage }"></jhi-item-count>
      <ngb-pagination
        [collectionSize]="totalItems"
        [(page)]="ngbPaginationPage"
        [pageSize]="itemsPerPage"
        [maxSize]="5"
        [rotate]="true"
        [boundaryLinks]="true"
        (pageChange)="loadPage($event)"
      ></ngb-pagination>
    </div>
  </div>
</div>
