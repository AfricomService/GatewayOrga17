<div class="row justify-content-center">
  <div class="col-8">
    <div *ngIf="formeJuridique">
      <h2 data-cy="formeJuridiqueDetailsHeading">
        <span jhiTranslate="orgacaregatewayApp.orgaCareFormeJuridique.detail.title">Forme Juridique</span>
      </h2>

      <hr />

      <jhi-alert-error></jhi-alert-error>

      <jhi-alert></jhi-alert>

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ formeJuridique.id }}</span>
        </dd>
        <dt><span jhiTranslate="orgacaregatewayApp.orgaCareFormeJuridique.abreviation">Abreviation</span></dt>
        <dd>
          <span>{{ formeJuridique.abreviation }}</span>
        </dd>
        <dt><span jhiTranslate="orgacaregatewayApp.orgaCareFormeJuridique.nom">Nom</span></dt>
        <dd>
          <span>{{ formeJuridique.nom }}</span>
        </dd>
        <dt><span jhiTranslate="orgacaregatewayApp.orgaCareFormeJuridique.dateCreation">Date Creation</span></dt>
        <dd>
          <span>{{ formeJuridique.dateCreation | formatMediumDatetime }}</span>
        </dd>
        <dt><span jhiTranslate="orgacaregatewayApp.orgaCareFormeJuridique.etat">Etat</span></dt>
        <dd>
          <span>{{ formeJuridique.etat }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>

      <button type="button" [routerLink]="['/forme-juridique', formeJuridique.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
  </div>
</div>
