<div class="departement-page">
  <!-- ══════════════ EN-TÊTE ══════════════ -->
  <div class="page-header">
    <div class="header-left">
      <div class="header-icon">
        <fa-icon icon="sitemap"></fa-icon>
      </div>
      <div>
        <h2 class="page-title" jhiTranslate="orgaCareGatewayApp.orgaCareDepartement.home.createOrEditLabel">
          Créer / Modifier un Département
        </h2>
        <p class="page-subtitle">Renseignez les informations du département</p>
      </div>
    </div>

    <div class="header-actions">
      <button type="button" class="btn-action btn-secondary-action" (click)="previousState()">
        <fa-icon icon="arrow-left"></fa-icon>
        <span jhiTranslate="entity.action.back">Retour</span>
      </button>

      <button type="button" class="btn-action btn-primary-action" [disabled]="editForm.invalid || isSaving" (click)="save()">
        <fa-icon *ngIf="!isSaving" icon="save"></fa-icon>
        <span *ngIf="isSaving" class="spinner-border spinner-border-sm me-1" role="status"></span>
        <span jhiTranslate="entity.action.save">Enregistrer</span>
      </button>
    </div>
  </div>

  <jhi-alert-error></jhi-alert-error>

  <!-- ══════════════ FORMULAIRE + ACCORDION ══════════════ -->
  <form [formGroup]="editForm" (ngSubmit)="save()">
    <ngb-accordion #acc="ngbAccordion" [closeOthers]="false" [activeIds]="activePanels" class="departement-accordion">
      <!-- ═══════════════════════════════════════════════
           Panel 0 — Informations Générales
      ════════════════════════════════════════════════ -->
      <ngb-panel id="panel-0">
        <ng-template ngbPanelHeader let-opened="opened">
          <button ngbPanelToggle class="accordion-btn" [class.opened]="opened">
            <div class="panel-header-content">
              <div class="panel-icon general">
                <fa-icon icon="building"></fa-icon>
              </div>
              <span>Informations Générales</span>
            </div>
            <fa-icon [icon]="opened ? 'chevron-up' : 'chevron-down'" class="chevron"></fa-icon>
          </button>
        </ng-template>

        <ng-template ngbPanelContent>
          <div class="panel-body">
            <!-- ID (mode édition seulement) -->
            <div class="field-group id-field" [hidden]="editForm.get('id')!.value == null">
              <label class="field-label" for="field_id" jhiTranslate="global.field.id">ID</label>
              <div class="input-wrapper">
                <span class="input-prefix"><fa-icon icon="key"></fa-icon></span>
                <input class="field-input with-prefix" id="field_id" type="number" formControlName="id" [readonly]="true" />
              </div>
            </div>

            <div class="form-grid">
              <!-- Code -->
              <div class="field-group">
                <label class="field-label" for="field_code" jhiTranslate="orgaCareGatewayApp.orgaCareDepartement.code"> Code </label>
                <div class="input-wrapper">
                  <span class="input-prefix"><fa-icon icon="hashtag"></fa-icon></span>
                  <input class="field-input with-prefix" id="field_code" type="text" formControlName="code" placeholder="Ex: DEPT-001" />
                </div>
              </div>

              <!-- Nom -->
              <div class="field-group">
                <label class="field-label" for="field_nom" jhiTranslate="orgaCareGatewayApp.orgaCareDepartement.nom"> Nom </label>
                <div class="input-wrapper">
                  <span class="input-prefix"><fa-icon icon="tag"></fa-icon></span>
                  <input
                    class="field-input with-prefix"
                    id="field_nom"
                    type="text"
                    formControlName="nom"
                    placeholder="Nom du département"
                  />
                </div>
              </div>

              <!-- Email -->
              <div class="field-group">
                <label class="field-label" for="field_email" jhiTranslate="orgaCareGatewayApp.orgaCareDepartement.email"> Email </label>
                <div class="input-wrapper">
                  <span class="input-prefix"><fa-icon icon="envelope"></fa-icon></span>
                  <input
                    class="field-input with-prefix"
                    id="field_email"
                    type="email"
                    formControlName="email"
                    placeholder="dept@exemple.com"
                  />
                </div>
              </div>

              <!-- Status -->
              <div class="field-group required">
                <label class="field-label" for="field_status" jhiTranslate="orgaCareGatewayApp.orgaCareDepartement.status"> Statut </label>
                <div class="input-wrapper select-wrapper">
                  <span class="input-prefix"><fa-icon icon="dot-circle"></fa-icon></span>
                  <select class="field-input field-select with-prefix" id="field_status" formControlName="status">
                    <option [ngValue]="null">{{ 'orgacaregatewayApp.Etat.null' | translate }}</option>
                    <option *ngFor="let etat of etatValues" [value]="etat">
                      {{ 'orgacaregatewayApp.Etat.' + etat | translate }}
                    </option>
                  </select>
                </div>
                <!-- Badge d'état sélectionné -->
                <div class="status-badge-row" *ngIf="editForm.get('status')!.value">
                  <span class="status-badge" [ngClass]="'status-' + editForm.get('status')!.value?.toLowerCase()">
                    {{ 'orgacaregatewayApp.Etat.' + editForm.get('status')!.value | translate }}
                  </span>
                </div>
                <div
                  class="field-error"
                  *ngIf="editForm.get('status')!.invalid && (editForm.get('status')!.dirty || editForm.get('status')!.touched)"
                >
                  <fa-icon icon="exclamation-circle"></fa-icon>
                  <small jhiTranslate="entity.validation.required">Ce champ est requis.</small>
                </div>
              </div>
            </div>
          </div>
        </ng-template>
      </ngb-panel>

      <!-- ═══════════════════════════════════════════════
           Panel 1 — Relations & Hiérarchie
      ════════════════════════════════════════════════ -->
      <ngb-panel id="panel-1">
        <ng-template ngbPanelHeader let-opened="opened">
          <button ngbPanelToggle class="accordion-btn" [class.opened]="opened">
            <div class="panel-header-content">
              <div class="panel-icon hierarchy">
                <fa-icon icon="network-wired"></fa-icon>
              </div>
              <span>Relations &amp; Hiérarchie</span>
            </div>
            <fa-icon [icon]="opened ? 'chevron-up' : 'chevron-down'" class="chevron"></fa-icon>
          </button>
        </ng-template>

        <ng-template ngbPanelContent>
          <div class="panel-body">
            <div class="form-grid">
              <!-- Organigramme -->
              <div class="field-group">
                <label class="field-label" for="field_organigramme" jhiTranslate="orgaCareGatewayApp.orgaCareDepartement.organigramme">
                  Organigramme
                </label>
                <div class="input-wrapper select-wrapper">
                  <span class="input-prefix"><fa-icon icon="project-diagram"></fa-icon></span>
                  <select class="field-input field-select with-prefix" id="field_organigramme" formControlName="organigramme">
                    <option [ngValue]="null">— Sélectionner —</option>
                    <option
                      [ngValue]="
                        organigrammeOption.id === editForm.get('organigramme')!.value?.id
                          ? editForm.get('organigramme')!.value
                          : organigrammeOption
                      "
                      *ngFor="let organigrammeOption of organigrammesSharedCollection; trackBy: trackOrganigrammeById"
                    >
                      {{ organigrammeOption.code ?? organigrammeOption.id }}
                    </option>
                  </select>
                </div>
              </div>

              <!-- Site -->
              <div class="field-group">
                <label class="field-label" for="field_site" jhiTranslate="orgaCareGatewayApp.orgaCareDepartement.site"> Site </label>
                <div class="input-wrapper select-wrapper">
                  <span class="input-prefix"><fa-icon icon="map-marker-alt"></fa-icon></span>
                  <select class="field-input field-select with-prefix" id="field_site" formControlName="site">
                    <option [ngValue]="null">— Sélectionner —</option>
                    <option
                      [ngValue]="siteOption.id === editForm.get('site')!.value?.id ? editForm.get('site')!.value : siteOption"
                      *ngFor="let siteOption of sitesSharedCollection; trackBy: trackSiteById"
                    >
                      {{ siteOption.nom ?? siteOption.id }}
                    </option>
                  </select>
                </div>
              </div>

              <!-- Département Parent -->
              <div class="field-group">
                <label
                  class="field-label"
                  for="field_departementParent"
                  jhiTranslate="orgaCareGatewayApp.orgaCareDepartement.departementParent"
                >
                  Département Parent
                </label>
                <div class="input-wrapper select-wrapper">
                  <span class="input-prefix"><fa-icon icon="sitemap"></fa-icon></span>
                  <select class="field-input field-select with-prefix" id="field_departementParent" formControlName="departementParent">
                    <option [ngValue]="null">— Aucun (racine) —</option>
                    <option
                      [ngValue]="
                        departementOption.id === editForm.get('departementParent')!.value?.id
                          ? editForm.get('departementParent')!.value
                          : departementOption
                      "
                      *ngFor="let departementOption of departementsSharedCollection; trackBy: trackDepartementById"
                    >
                      {{ departementOption.nom ?? departementOption.code ?? departementOption.id }}
                    </option>
                  </select>
                </div>
              </div>
            </div>

            <!-- ── Personnes (multi-sélect) ── -->
            <div class="personnes-section">
              <div class="section-divider">
                <span class="divider-label">
                  <fa-icon icon="users"></fa-icon>
                  Membres du département
                </span>
              </div>

              <div class="personnes-select-wrapper">
                <select class="field-select personnes-select" id="field_personnes" multiple formControlName="personnes">
                  <option
                    [ngValue]="getSelectedPersonne(personneOption, editForm.get('personnes')!.value)"
                    *ngFor="let personneOption of personnesSharedCollection; trackBy: trackPersonneById"
                  >
                    {{ personneOption.nomPrenom ?? personneOption.id }}
                  </option>
                </select>
                <p class="select-hint">
                  <fa-icon icon="info-circle"></fa-icon>
                  Maintenez <kbd>Ctrl</kbd> (ou <kbd>⌘</kbd> sur Mac) pour sélectionner plusieurs personnes.
                </p>
              </div>
            </div>
          </div>
        </ng-template>
      </ngb-panel>
    </ngb-accordion>
  </form>
</div>
