<div class="departement-page">
  <!-- ══════════════ EN-TÊTE ══════════════ -->
  <div class="page-header">
    <div class="header-left">
      <div class="header-icon">
        <fa-icon icon="sitemap"></fa-icon>
      </div>
      <div>
        <h2 class="page-title" jhiTranslate="orgacaregatewayApp.orgaCareDepartement.home.createOrEditLabel">
          Créer / Modifier un Département
        </h2>
        <p class="page-subtitle">Renseignez les informations du département</p>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-action btn-secondary-action" (click)="previousState()">
        <fa-icon icon="arrow-left"></fa-icon>
        <span jhiTranslate="entity.action.back">Retour</span>
      </button>
      <button type="button" class="btn-action btn-primary-action" [disabled]="editForm.invalid || isSaving" (click)="save()">
        <fa-icon *ngIf="!isSaving" icon="save"></fa-icon>
        <span *ngIf="isSaving" class="spinner-border spinner-border-sm me-1" role="status"></span>
        <span jhiTranslate="entity.action.save">Enregistrer</span>
      </button>
    </div>
  </div>

  <jhi-alert-error></jhi-alert-error>

  <form [formGroup]="editForm" (ngSubmit)="save()">
    <ngb-accordion #acc="ngbAccordion" [closeOthers]="false" [activeIds]="activePanels" class="departement-accordion">
      <!-- ══════════ Panel 0 — Détails ══════════ -->
      <ngb-panel id="panel-0">
        <ng-template ngbPanelHeader let-opened="opened">
          <button ngbPanelToggle class="accordion-btn" [class.opened]="opened">
            <div class="panel-header-content">
              <div class="panel-icon general"><fa-icon icon="building"></fa-icon></div>
              <span>Détails</span>
            </div>
            <fa-icon [icon]="opened ? 'chevron-up' : 'chevron-down'" class="chevron"></fa-icon>
          </button>
        </ng-template>
        <ng-template ngbPanelContent>
          <div class="panel-body">
            <div class="form-grid">
              <!-- Code -->
              <div class="field-group">
                <label class="field-label" for="field_code">Code</label>
                <div class="input-wrapper">
                  <span class="input-prefix"><fa-icon icon="hashtag"></fa-icon></span>
                  <input class="field-input with-prefix" id="field_code" type="text" formControlName="code" placeholder="Ex: DEPT-001" />
                </div>
              </div>

              <!-- Nom -->
              <div class="field-group">
                <label class="field-label" for="field_nom">Nom</label>
                <div class="input-wrapper">
                  <span class="input-prefix"><fa-icon icon="tag"></fa-icon></span>
                  <input
                    class="field-input with-prefix"
                    id="field_nom"
                    type="text"
                    formControlName="nom"
                    placeholder="Nom du département"
                  />
                </div>
              </div>

              <!-- Email -->
              <div class="field-group">
                <label class="field-label" for="field_email">Email</label>
                <div class="input-wrapper">
                  <span class="input-prefix"><fa-icon icon="envelope"></fa-icon></span>
                  <input
                    class="field-input with-prefix"
                    id="field_email"
                    type="email"
                    formControlName="email"
                    placeholder="dept@exemple.com"
                  />
                </div>
              </div>

              <!-- Organigramme -->
              <div class="field-group">
                <label class="field-label" for="field_organigramme">Organigramme</label>
                <div class="input-wrapper select-wrapper">
                  <span class="input-prefix"><fa-icon icon="project-diagram"></fa-icon></span>
                  <select class="field-input field-select with-prefix" id="field_organigramme" formControlName="organigramme">
                    <option [ngValue]="null">— Sélectionner —</option>
                    <option
                      [ngValue]="
                        organigrammeOption.id === editForm.get('organigramme')!.value?.id
                          ? editForm.get('organigramme')!.value
                          : organigrammeOption
                      "
                      *ngFor="let organigrammeOption of organigrammesSharedCollection; trackBy: trackOrganigrammeById"
                    >
                      {{ organigrammeOption.nom ?? organigrammeOption.code ?? organigrammeOption.id }}
                    </option>
                  </select>
                </div>
              </div>

              <!-- Société (lecture seule, déduite de l'organigramme) -->
              <div class="field-group">
                <label class="field-label">Société</label>
                <div class="input-wrapper">
                  <span class="input-prefix"><fa-icon icon="building"></fa-icon></span>
                  <input
                    class="field-input with-prefix"
                    type="text"
                    [value]="societeRaisonSociale ?? ''"
                    [readonly]="true"
                    placeholder="Société associée à l'organigramme"
                  />
                </div>
              </div>
            </div>
          </div>
        </ng-template>
      </ngb-panel>

      <!-- ══════════ Panel 1 — Hiérarchies ══════════ -->
      <ngb-panel id="panel-1">
        <ng-template ngbPanelHeader let-opened="opened">
          <button ngbPanelToggle class="accordion-btn" [class.opened]="opened">
            <div class="panel-header-content">
              <div class="panel-icon hierarchy"><fa-icon icon="sitemap"></fa-icon></div>
              <span>Hiérarchies</span>
            </div>
            <fa-icon [icon]="opened ? 'chevron-up' : 'chevron-down'" class="chevron"></fa-icon>
          </button>
        </ng-template>
        <ng-template ngbPanelContent>
          <div class="panel-body">
            <div class="form-grid">
              <!-- Département Parent -->
              <div class="field-group">
                <label class="field-label" for="field_departementParent">Département Parent</label>
                <div class="input-wrapper select-wrapper">
                  <span class="input-prefix"><fa-icon icon="sitemap"></fa-icon></span>
                  <select class="field-input field-select with-prefix" id="field_departementParent" formControlName="departementParent">
                    <option [ngValue]="null">— Aucun (racine) —</option>
                    <option
                      [ngValue]="
                        departementOption.id === editForm.get('departementParent')!.value?.id
                          ? editForm.get('departementParent')!.value
                          : departementOption
                      "
                      *ngFor="let departementOption of departementsSharedCollection; trackBy: trackDepartementById"
                    >
                      {{ departementOption.nom ?? departementOption.code ?? departementOption.id }}
                    </option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </ng-template>
      </ngb-panel>

      <!-- ══════════ Panel 2 — Membres ══════════ -->
      <ngb-panel id="panel-2">
        <ng-template ngbPanelHeader let-opened="opened">
          <button ngbPanelToggle class="accordion-btn" [class.opened]="opened">
            <div class="panel-header-content">
              <div class="panel-icon membres"><fa-icon icon="users"></fa-icon></div>
              <span>Membres</span>
            </div>
            <fa-icon [icon]="opened ? 'chevron-up' : 'chevron-down'" class="chevron"></fa-icon>
          </button>
        </ng-template>
        <ng-template ngbPanelContent>
          <div class="panel-body">
            <div class="membres-list">
              <!-- Chef -->
              <div class="membre-row">
                <div class="membre-info">
                  <span class="membre-label">Chef :</span>
                  <span class="membre-value">{{ getPersonnesLabel(chefs) }}</span>
                </div>
                <button type="button" class="btn-modifier" (click)="openModifierPersonnes('CHEF')">Modifier</button>
              </div>

              <!-- Assistant -->
              <div class="membre-row">
                <div class="membre-info">
                  <span class="membre-label">Assistant :</span>
                  <span class="membre-value">{{ getPersonnesLabel(assistants) }}</span>
                </div>
                <button type="button" class="btn-modifier" (click)="openModifierPersonnes('ASSISTANT')">Modifier</button>
              </div>

              <!-- Membre -->
              <div class="membre-row">
                <div class="membre-info">
                  <span class="membre-label">Membre :</span>
                  <span class="membre-value">{{ getPersonnesLabel(membres) }}</span>
                </div>
                <button type="button" class="btn-modifier" (click)="openModifierPersonnes('MEMBRE')">Modifier</button>
              </div>

              <!-- Intérim -->
              <div class="membre-row">
                <div class="membre-info">
                  <span class="membre-label">Intérim :</span>
                  <span class="membre-value">{{ getPersonnesLabel(interims) }}</span>
                </div>
                <button type="button" class="btn-modifier" (click)="openModifierPersonnes('INTERIM')">Modifier</button>
              </div>
            </div>
          </div>
        </ng-template>
      </ngb-panel>
    </ngb-accordion>
  </form>
</div>
