<div class="fonction-list-container">
  <!-- Header Banner -->
  <div class="page-header">
    <div class="header-left">
      <div class="header-icon">
        <fa-icon icon="briefcase"></fa-icon>
      </div>
      <div class="header-text">
        <h1 id="page-heading" data-cy="FonctionHeading" jhiTranslate="orgacaregatewayApp.orgaCareFonction.home.title">Fonctions</h1>
        <p>Gérez et consultez la liste des fonctions</p>
      </div>
    </div>
    <div class="header-actions">
      <button
        class="btn-header-secondary"
        (click)="loadPage()"
        [disabled]="isLoading"
        title="{{ 'orgacaregatewayApp.orgaCareFonction.home.refreshListLabel' | translate }}"
      >
        <fa-icon icon="sync" [spin]="isLoading"></fa-icon>
      </button>
      <button
        *ngIf="canEdit"
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn-header-primary"
        [routerLink]="['/fonction/new']"
        title="{{ 'orgacaregatewayApp.orgaCareFonction.home.createLabel' | translate }}"
      >
        <fa-icon icon="plus"></fa-icon>
      </button>
    </div>
  </div>

  <jhi-alert-error></jhi-alert-error>
  <jhi-alert></jhi-alert>

  <!-- Empty State -->
  <div class="empty-state" id="no-result" *ngIf="!isLoading && fonctions?.length === 0">
    <div class="empty-icon">💼</div>
    <h3 jhiTranslate="orgacaregatewayApp.orgaCareFonction.home.notFound">Aucune fonction trouvée</h3>
    <ng-container *ngIf="canEdit">
      <p>Commencez par créer une nouvelle fonction</p>
      <button class="btn-create" [routerLink]="['/fonction/new']">
        <fa-icon icon="plus"></fa-icon>
        Créer une fonction
      </button>
    </ng-container>
  </div>

  <!-- Table Card -->
  <div class="table-card" id="entities" *ngIf="fonctions && fonctions.length > 0">
    <div class="table-wrapper">
      <table aria-describedby="page-heading">
        <thead>
          <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" (sortChange)="loadPage()">
            <th scope="col" jhiSortBy="label">
              <div class="th-content">
                <span jhiTranslate="orgacaregatewayApp.orgaCareFonction.label">Libellé</span>
                <fa-icon icon="sort" class="sort-icon"></fa-icon>
              </div>
            </th>
            <th scope="col" jhiSortBy="code">
              <div class="th-content">
                <span jhiTranslate="orgacaregatewayApp.orgaCareFonction.code">Code</span>
                <fa-icon icon="sort" class="sort-icon"></fa-icon>
              </div>
            </th>
            <th scope="col" class="th-actions" *ngIf="canEdit">
              <span>Actions</span>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let fonction of fonctions; trackBy: trackId" data-cy="entityTable" (click)="openFonction(fonction)" class="table-row">
            <td>
              <div class="cell-nom">
                <div class="nom-avatar">{{ (fonction.label || fonction.code || '?')[0].toUpperCase() }}</div>
                <span class="nom-text">{{ fonction.label || '—' }}</span>
              </div>
            </td>
            <td>
              <span class="badge-code" *ngIf="fonction.code; else noCode">{{ fonction.code }}</span>
              <ng-template #noCode><span class="cell-empty">—</span></ng-template>
            </td>
            <td class="td-actions" *ngIf="canEdit">
              <button
                type="button"
                class="btn-delete"
                data-cy="entityDeleteButton"
                (click)="delete(fonction); $event.stopPropagation()"
                title="{{ 'entity.action.delete' | translate }}"
              >
                <fa-icon icon="trash"></fa-icon>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="pagination-bar">
      <jhi-item-count [params]="{ page: page, totalItems: totalItems, itemsPerPage: itemsPerPage }"></jhi-item-count>
      <ngb-pagination
        [collectionSize]="totalItems"
        [(page)]="ngbPaginationPage"
        [pageSize]="itemsPerPage"
        [maxSize]="5"
        [rotate]="true"
        [boundaryLinks]="true"
        (pageChange)="loadPage($event)"
      ></ngb-pagination>
    </div>
  </div>
</div>
