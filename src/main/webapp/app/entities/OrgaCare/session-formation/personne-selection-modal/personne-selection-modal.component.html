<div class="modal-header">
  <h4 class="modal-title">{{ title }}</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
</div>

<div class="modal-body">
  <input
    type="text"
    class="form-control mb-3"
    placeholder="Rechercher par nom ou matricule…"
    [value]="search"
    (input)="search = $any($event.target).value"
  />

  <div class="table-wrapper">
    <table class="table table-hover align-middle mb-0">
      <thead>
        <tr>
          <th style="width: 40px">
            <input type="checkbox" [checked]="allSelected" (change)="toggleAll()" />
          </th>
          <th>Matricule</th>
          <th>Nom &amp; prénom</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of filtered; trackBy: trackById" (click)="toggle(p.id!)" class="clickable">
          <td><input type="checkbox" [checked]="isSelected(p.id!)" (click)="$event.stopPropagation()" (change)="toggle(p.id!)" /></td>
          <td>{{ p.matricule }}</td>
          <td>{{ p.nomPrenom }}</td>
        </tr>
        <tr *ngIf="filtered.length === 0">
          <td colspan="3" class="text-center text-muted py-4">Aucune personne trouvée</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal-footer">
  <span class="me-auto text-muted">{{ selected.size }} sélectionné(s)</span>
  <button type="button" class="btn btn-secondary" (click)="cancel()">Annuler</button>
  <button type="button" class="btn btn-primary" (click)="confirm()">Valider</button>
</div>
