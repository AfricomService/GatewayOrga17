<div class="grade-list-container">
  <!-- Header Banner -->
  <div class="page-header">
    <div class="header-left">
      <div class="header-icon">
        <fa-icon icon="award"></fa-icon>
      </div>
      <div class="header-text">
        <h1 id="page-heading" data-cy="GradeHeading" jhiTranslate="orgacaregatewayApp.orgaCareGrade.home.title">Grades</h1>
        <p>Gérez et consultez la liste des grades</p>
      </div>
    </div>
    <div class="header-actions">
      <button
        class="btn-header-secondary"
        (click)="loadPage()"
        [disabled]="isLoading"
        title="{{ 'orgacaregatewayApp.orgaCareGrade.home.refreshListLabel' | translate }}"
      >
        <fa-icon icon="sync" [spin]="isLoading"></fa-icon>
      </button>
      <button
        *ngIf="canEdit"
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn-header-primary"
        [routerLink]="['/grade/new']"
        title="{{ 'orgacaregatewayApp.orgaCareGrade.home.createLabel' | translate }}"
      >
        <fa-icon icon="plus"></fa-icon>
      </button>
    </div>
  </div>

  <jhi-alert-error></jhi-alert-error>
  <jhi-alert></jhi-alert>

  <!-- Empty State -->
  <div class="empty-state" id="no-result" *ngIf="!isLoading && grades?.length === 0">
    <div class="empty-icon">🎖️</div>
    <h3 jhiTranslate="orgacaregatewayApp.orgaCareGrade.home.notFound">Aucun grade trouvé</h3>
    <ng-container *ngIf="canEdit">
      <p>Commencez par créer un nouveau grade</p>
      <button class="btn-create" [routerLink]="['/grade/new']">
        <fa-icon icon="plus"></fa-icon>
        Créer un grade
      </button>
    </ng-container>
  </div>

  <!-- Table Card -->
  <div class="table-card" id="entities" *ngIf="grades && grades.length > 0">
    <div class="table-wrapper">
      <table aria-describedby="page-heading">
        <thead>
          <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" (sortChange)="loadPage()">
            <th scope="col" jhiSortBy="label">
              <div class="th-content">
                <span jhiTranslate="orgacaregatewayApp.orgaCareGrade.label">Libellé</span>
                <fa-icon icon="sort" class="sort-icon"></fa-icon>
              </div>
            </th>
            <th scope="col" jhiSortBy="code">
              <div class="th-content">
                <span jhiTranslate="orgacaregatewayApp.orgaCareGrade.code">Code</span>
                <fa-icon icon="sort" class="sort-icon"></fa-icon>
              </div>
            </th>
            <th scope="col" class="th-actions" *ngIf="canEdit">
              <span>Actions</span>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let grade of grades; trackBy: trackId" data-cy="entityTable" (click)="openGrade(grade)" class="table-row">
            <td>
              <div class="cell-nom">
                <div class="nom-avatar">{{ (grade.label || grade.code || '?')[0].toUpperCase() }}</div>
                <span class="nom-text">{{ grade.label || '—' }}</span>
              </div>
            </td>
            <td>
              <span class="badge-code" *ngIf="grade.code; else noCode">{{ grade.code }}</span>
              <ng-template #noCode><span class="cell-empty">—</span></ng-template>
            </td>
            <td class="td-actions" *ngIf="canEdit">
              <button
                type="button"
                class="btn-delete"
                data-cy="entityDeleteButton"
                (click)="delete(grade); $event.stopPropagation()"
                title="{{ 'entity.action.delete' | translate }}"
              >
                <fa-icon icon="trash"></fa-icon>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="pagination-bar">
      <jhi-item-count [params]="{ page: page, totalItems: totalItems, itemsPerPage: itemsPerPage }"></jhi-item-count>
      <ngb-pagination
        [collectionSize]="totalItems"
        [(page)]="ngbPaginationPage"
        [pageSize]="itemsPerPage"
        [maxSize]="5"
        [rotate]="true"
        [boundaryLinks]="true"
        (pageChange)="loadPage($event)"
      ></ngb-pagination>
    </div>
  </div>
</div>
